            .print-full-page, .print-full-page * { visibility: visible; color: black !important; }

                left: 0;
                top: 0;

                margin: 0 auto;
                padding: 0;
                box-shadow: none !important;
                background: white !important;
                font-family: 'Inter', sans-serif !important;

            .print-full-page {
                position: absolute;
                left: 0;
                top: 0;
                width: 100% !important;
                max-width: 100% !important;
                margin: 0;
                padding: 15mm;
                box-shadow: none !important;
                background: white !important;

                    const device = await navigator.bluetooth.requestDevice({

                        optionalServices: [

                            'e7810a71-73ae-499d-8c15-faa9aef0c3f2',

                        ]
                    });

                    const server = await device.gatt.connect();
                    const services = await server.getPrimaryServices();
                    let targetChar = null;

                    for (const service of services) {
                        const characteristics = await service.getCharacteristics();
                        for (const char of characteristics) {
                            if (char.properties.write || char.properties.writeWithoutResponse) {
                                targetChar = char;
                                break;
                            }
                        }
                        if (targetChar) break;
                    }

                    if (!targetChar) {
                        device.gatt.disconnect();
                        throw new Error("El dispositivo no admite impresión directa.");
                    }

                    printerDeviceRef.current = device;
                    printerCharRef.current = targetChar;
                    setIsPrinterReady(true);

                try {
                    showNotify("Imprimiendo ticket...");
                    let bytes = [];
                    const addBytes = (arr) => bytes.push(...arr);
                    
                    const sanitize = (text) => text.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/ñ/g, "n").replace(/Ñ/g, "N");
                    
                    const addText = (text) => {
                        const str = sanitize(text);
                        for (let i = 0; i < str.length; i++) bytes.push(str.charCodeAt(i));
                    };

                    const is80mm = userProfile?.paperSize === '80mm';
                    const charsPerLine = is80mm ? 48 : 32;

                    const centerText = (text) => {
                        const str = sanitize(text);
                        const spaces = Math.max(0, Math.floor((charsPerLine - str.length) / 2));
                        addText(' '.repeat(spaces) + str + '\n');
                    };

                    const padText = (left, right) => {
                        const lStr = sanitize(left);
                        const rStr = sanitize(right);
                        const spaces = Math.max(0, charsPerLine - lStr.length - rStr.length);
                        addText(lStr + ' '.repeat(spaces) + rStr + '\n');
                    };

                    const hr = () => addText('-'.repeat(charsPerLine) + '\n');

                    addBytes([0x1B, 0x40]); 
                    
                    addBytes([0x1B, 0x61, 0x01]); 
                    addBytes([0x1B, 0x45, 0x01]); 
                    addBytes([0x1D, 0x21, 0x11]); 
                    centerText(companyName);
                    addBytes([0x1D, 0x21, 0x00]); 
                    addBytes([0x1B, 0x45, 0x00]); 
                    addText("\nRECIBO DE PAGO\n\n");
                    
                    addBytes([0x1B, 0x61, 0x00]); 
                    padText("Fecha:", data.transaction.date);
                    padText("Ref:", data.transaction.ref);
                    padText("Cliente:", data.client.name.substring(0, charsPerLine - 10));
                    hr();
                    padText("Concepto:", data.transaction.description.substring(0, charsPerLine - 11));
                    const _modLabel = loanModalityLabel(data.client.loan);
                    if (_modLabel) padText("Modalidad:", _modLabel.substring(0, charsPerLine - 12));
                    if (data.client.loan?.type === 'P-GARANTIA' && data.client.loan?.guaranteeDeadline) padText("Vence Garantia:", data.client.loan.guaranteeDeadline);
                    const _gItems = data.client.loan?.guaranteeItems || [];
                    if (data.client.loan?.type === 'P-GARANTIA' && _gItems.length > 0) {
                        hr();
                        addText("GARANTIA:\n");
                        _gItems.forEach(g => {
                            addText((((g.code ? g.code + " " : "") + (g.name || "Sin nombre"))).substring(0, charsPerLine) + "\n");
                        });
                    }
                    
                    addBytes([0x1B, 0x45, 0x01]); 
                    padText("Recibido:", `${currency}${Math.round(data.transaction.amount).toLocaleString()}`);
                    addBytes([0x1B, 0x45, 0x00]); 
                    
                    if (data.transaction.paidMora > 0) padText("Mora Pagada:", `-${currency}${Math.round(data.transaction.paidMora).toLocaleString()}`);
                    if (data.transaction.surplus > 0) padText("Abono Prox.:", `${currency}${Math.round(data.transaction.surplus).toLocaleString()}`);
                    hr();

                        padText("Cuotas Rest:", String(data.transaction.remainingInstallments));
                    }

                    addBytes([0x1B, 0x61, 0x01]); 
                    addText("\n" + receiptFooter + "\n");
                    addBytes([0x0A, 0x0A, 0x0A]); 

                    const payload = new Uint8Array(bytes);
                    const CHUNK_SIZE = 100;
                    for (let i = 0; i < payload.length; i += CHUNK_SIZE) {
                        const chunk = payload.slice(i, i + CHUNK_SIZE);
                        await printerCharRef.current.writeValue(chunk);
                    }
                    
                    showNotify("Impresión exitosa");
                } catch (error) {

                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            let width = img.width;
                            let height = img.height;
                            const MAX_WIDTH = 800; 
                            if (width > MAX_WIDTH) {
                                height = Math.round((height * MAX_WIDTH) / width);
                                width = MAX_WIDTH;
                            }
                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            
                            // Si el archivo es PNG, usar image/png para conservar transparencia. Si no, usar JPEG.
                            const isPng = file.type === 'image/png';
                            resolve(canvas.toDataURL(isPng ? 'image/png' : 'image/jpeg', isPng ? undefined : 0.6)); 
                        };
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                });

                                                } else if (typeof subEnd === 'string' && /^\d{4}-\d{2}-\d{2}/.test(subEnd)) {

                                                    const p = subEnd.split('-').map(Number);
                                                    endDate = new Date(p[0], p[1] - 1, p[2], 23, 59, 59);
                                                } else {
                                                    endDate = new Date(subEnd);
                                                }
                                            }

                                                locked = true;
                                                if (auth.currentUser) {
                                                    auth.currentUser.reload().catch(err => console.error('Error reloading auth user:', err));

                                            } else if (endDate && !isNaN(endDate.getTime())) {
                                                const now = new Date();
                                                if (now > endDate) {
                                                    locked = true;
                                                } else {
                                                    const days = Math.ceil((endDate - now) / (1000 * 60 * 60 * 24));
                                                    setDaysRemaining(days);
                                                }
                                            } else {
                                                setDaysRemaining(null);
                                            }

                                            if (locked) {
                                                setDaysRemaining(null);
                                            }
                                            setIsLocked(locked);
                                        } catch (e) {

            const recordTransaction = async (clientId, inputAmount, dateOverride) => {
                if(isProcessing || !adminUid) return;
                setIsProcessing(true);
                const client = clients.find(c => c.id === clientId);
                
                if (!client) {
                    showNotify("Cliente no encontrado");
                    setIsProcessing(false);
                    return;
                }
                
                if (!client.loan) {
                    showNotify("Este cliente no tiene un préstamo activo");
                    setIsProcessing(false);
                    return;
                }

                let amountStr = String(inputAmount).replace(/,/g, '');
                let amount = parseFloat(amountStr) || 0;
                
                if (amount <= 0) { 
                    setIsProcessing(false); 
                    return showNotify("Monto inválido"); 
                }

                try {
                    let newHistory = Array.isArray(client.history) ? [...client.history] : [];
                    const loanType = effLoanTypeOf(client.loan);
                    const instBaseAmount = client.loan.installmentAmount || 0;
                    const partialCredit = client.loan.partialCredit || 0;
                    const paidMora = client.loan.mora || 0;
                    
                    let totalMoneyAvailable = amount + partialCredit;
                    
                    if (paidMora > 0 && totalMoneyAvailable > 0) {
                        totalMoneyAvailable = Math.max(0, totalMoneyAvailable - paidMora);
                    }

                    let installmentsCovered = 0;
                    let surplus = 0;
                    let newPaid = client.loan.paidInstallments || 0;
                    let currentPaid = newPaid;
                    
                    let newDebt = client.totalDebt;
                    let nextDate = client.loan.nextPaymentDate || formatDate(new Date());
                    if (nextDate.includes('NaN')) nextDate = formatDate(new Date());
                    let description = '';

                    // CORRECTED LOGIC: Separate handling for each loan type
                    if (loanType === 'Rédito' || loanType === 'P-GARANTIA') {
                        if (transactionType === 'Capital') {
                            // Pure capital payment
                            newDebt = Math.max(0, client.totalDebt - totalMoneyAvailable);
                            surplus = 0; 
                            description = 'Abono a Capital';
                        } else {
                            // Interest/installment payment
                            installmentsCovered = Math.floor(totalMoneyAvailable / instBaseAmount);
                            surplus = totalMoneyAvailable % instBaseAmount;
                            newPaid = currentPaid + installmentsCovered;
                            if (installmentsCovered > 0) { 
                                for(let i=0; i < installmentsCovered; i++) { 
                                    nextDate = calculateNextDate(nextDate, client.loan.frequency); 
                                } 
                            }
                            description = installmentsCovered > 0 ? `Pago Interés (${installmentsCovered} cuotas)` : (paidMora > 0 ? 'Pago de Mora' : 'Abono parcial a interés');
                        }
                    } else if (loanType === 'TIPO SAM') {
                        if (transactionType === 'Interés') {
                            newDebt = client.totalDebt; // Does not reduce principal
                            description = 'Pago de rédito';
                        } else if (transactionType === 'Capital') {
                            newDebt = Math.max(0, client.totalDebt - amount); // Reduces principal
                            description = 'Abono a capital';
                        }
                    } else if (loanType === 'Amortizado') {
                        if (transactionType === 'Capital') {
                            newDebt = Math.max(0, client.totalDebt - totalMoneyAvailable);
                            surplus = 0; 
                            description = 'Abono a Capital (Reducción de Deuda)';
                        } else {
                            installmentsCovered = Math.floor(totalMoneyAvailable / instBaseAmount);
                            surplus = totalMoneyAvailable % instBaseAmount;
                            newPaid = Math.min(client.loan.totalInstallments || 1, currentPaid + installmentsCovered);
                            let totalMoneyToDiscount = installmentsCovered * instBaseAmount;
                            newDebt = Math.max(0, client.totalDebt - totalMoneyToDiscount);
                            
                            if (installmentsCovered > 0) { 
                                for(let i=0; i < installmentsCovered; i++) { 
                                    nextDate = calculateNextDate(nextDate, client.loan.frequency); 
                                } 
                            }
                            description = installmentsCovered > 0 ? `Pago Cuota ${newPaid}/${client.loan.totalInstallments}` : (paidMora > 0 ? 'Pago de Mora' : 'Abono parcial');
                        }
                    }

                    let newInstallmentAmount = instBaseAmount;
                    let gainAmount = 0;
                    
                    // Calculate gain based on loan type
                    if (loanType === 'Rédito' || loanType === 'TIPO SAM' || loanType === 'P-GARANTIA') {
                        // Solo el pago de interés es ganancia; el abono a capital devuelve principal (no es ganancia)
                        gainAmount = transactionType === 'Interés' ? amount : 0;
                    } else {
                        // Amortizado: ganancia por cuota = interés total / número de cuotas
                        // (la fórmula anterior con interest/(100+interest) solo era correcta para interés 'Fijo';
                        //  en 'Por Cuota' subestimaba la ganancia)
                        const loanTotalInterest = (client.loan.totalToPay || 0) - (client.loan.amount || 0);
                        const loanTotalInst = client.loan.totalInstallments || 1;
                        gainAmount = (installmentsCovered > 0 && loanTotalInterest > 0)
                            ? installmentsCovered * (loanTotalInterest / loanTotalInst)
                            : 0;
                    }
                    
                    let gainRecord = {
                        clientId: client.id, 
                        clientName: client.name,
                        date: dateOverride ? parseDateString(dateOverride).toLocaleDateString('es-DO') : formatDate(new Date()),
                        totalValue: amount,
                        gainAmount: gainAmount,
                        status: 'Activo', 
                        type: transactionType, 
                        timestamp: new Date().toISOString()
                    };

                    const transaction = {
                        id: Date.now().toString(), 
                        amount: amount, 
                        surplus: surplus,
                        date: dateOverride ? parseDateString(dateOverride).toLocaleDateString('es-DO') : new Date().toLocaleString('es-DO'),
                        type: transactionType, 
                        description: description,
                        ref: Math.floor(1000 + Math.random() * 8999).toString(),
                        installmentStatus: installmentsCovered > 0 ? 'Pagada' : 'Abono',
                        remainingInstallments: (loanType === 'Rédito' || loanType === 'P-GARANTIA') ? '∞' : (client.loan.totalInstallments || 1) - newPaid,
                        paidMora: paidMora, 
                        remainingDebt: newDebt
                    };

                    // Update database
                    if (amount > 0) {
                        newHistory.unshift(transaction);
                    }

                    let updateData = {};
                    if (newDebt <= DEUDA_THRESHOLD) {
                        updateData = { totalDebt: 0, loan: null, history: newHistory };
                    } else {
                        updateData = {
                            totalDebt: newDebt, 
                            'loan.paidInstallments': newPaid, 
                            'loan.nextPaymentDate': nextDate,
                            'loan.partialCredit': surplus, 
                            'loan.installmentAmount': newInstallmentAmount, 
                            'loan.mora': 0, 
                            history: newHistory
                        };
                    }

                    const clientUpdatePromise = db.collection('users').doc(adminUid).collection('clients').doc(clientId).update(updateData);
                    
                    let gainsPromise = Promise.resolve();
                    if (amount > 0) {
                        gainsPromise = db.collection('users').doc(adminUid).collection('gains').add(gainRecord);
                    }

                    if (isOnline) {
                        await Promise.all([clientUpdatePromise, gainsPromise]);
                    } else {
                        clientUpdatePromise.catch(e => console.log("Transaction queued for sync:", e));
                        gainsPromise.catch(e => console.log("Gains queued for sync:", e));
                    }

                    if (newDebt <= DEUDA_THRESHOLD) {
                        showNotify("¡Préstamo Saldado!");
                    } else {
                        showNotify("Transacción Registrada");
                    }

                    setIsTransacting(false);
                    if(amount > 0) setReceiptData({ client, transaction });
                } catch (error) { 
                    console.error("Transaction error:", error);
                    showNotify("Error al procesar el pago. " + error.message); 
                } finally { 
                    setIsProcessing(false); 
                }
            };

                                                <select value={editingCobrador.route} onChange={e => setEditingCobrador({...editingCobrador, route: e.target.value})} className="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-700 outline-none focus:border-indigo-500 appearance-none">
                                                    <option value="Todas">Todas las rutas (Acceso Global)</option>
                                                    {routesList.map((r, i) => <option key={i} value={r}>{r}</option>)}
                                                </select>
                                            </div>
                                            <button type="submit" disabled={isProcessing} className="w-full bg-indigo-600 text-white p-4 rounded-xl font-black mt-4 shadow-lg active:scale-95 transition-all">{isProcessing ? 'Guardando...' : 'Guardar Cambios'}</button>
                                        </form>
                                    </div>
                                </div>
                            )}


                        </div>
                    )}
                </div>
                            {/* Barra de navegación inferior (móvil) */}
                            {['dashboard','portfolio','guarantees','earnings','routes_panel','settings'].includes(view) && (
                                <nav className="md:hidden fixed bottom-0 left-0 right-0 z-[90] no-print">
                                    <div className="mx-auto max-w-md bg-white/95 backdrop-blur border-t border-slate-200 shadow-[0_-8px_30px_rgba(0,0,0,0.08)]">
                                        <div className="grid grid-cols-5 items-end px-1 pt-1.5 pb-[max(0.6rem,env(safe-area-inset-bottom))]">
                                            <button onClick={() => setView('dashboard')} className={`flex flex-col items-center gap-1 py-1.5 rounded-xl active:scale-95 ${view === 'dashboard' ? 'text-indigo-600' : 'text-slate-400'}`}>
                                                <Icon name="home" size={22}/><span className="text-[9px] font-black uppercase tracking-widest">Inicio</span>
                                            </button>
                                            <button onClick={() => setView('portfolio')} className={`flex flex-col items-center gap-1 py-1.5 rounded-xl active:scale-95 ${view === 'portfolio' ? 'text-indigo-600' : 'text-slate-400'}`}>
                                                <Icon name="users" size={22}/><span className="text-[9px] font-black uppercase tracking-widest">Cartera</span>
                                            </button>
                                            <button onClick={() => { setQuickCobrarSearch(''); setQuickCobrarOpen(true); }} className="flex flex-col items-center gap-1 active:scale-95 -mt-7">
                                                <span className="w-14 h-14 bg-emerald-500 text-white rounded-full flex items-center justify-center shadow-xl shadow-emerald-500/40 border-4 border-slate-50"><Icon name="plus" size={26}/></span>
                                                <span className="text-[9px] font-black uppercase tracking-widest text-emerald-600">Cobrar</span>
                                            </button>
                                            <button onClick={() => { setGuaranteeTab('active'); setGuaranteeSearch(''); setView('guarantees'); }} className={`flex flex-col items-center gap-1 py-1.5 rounded-xl active:scale-95 relative ${view === 'guarantees' ? 'text-indigo-600' : 'text-slate-400'}`}>
                                                <Icon name="shield" size={22}/><span className="text-[9px] font-black uppercase tracking-widest">Garantías</span>
                                                {expiredGuaranteesCount > 0 && <span className="absolute top-0 right-1/2 translate-x-4 w-2.5 h-2.5 bg-red-500 rounded-full border border-white"></span>}
                                            </button>
                                            {userProfile?.role !== 'cobrador' ? (
                                                <button onClick={() => setView('settings')} className={`flex flex-col items-center gap-1 py-1.5 rounded-xl active:scale-95 ${view === 'settings' ? 'text-indigo-600' : 'text-slate-400'}`}>
                                                    <Icon name="settings" size={22}/><span className="text-[9px] font-black uppercase tracking-widest">Ajustes</span>
                                                </button>
                                            ) : <div/>}
                                        </div>
                                    </div>
                                </nav>
                            )}

                            {/* Modal de cobro rápido */}
                            {quickCobrarOpen && (
                                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[300] flex items-end sm:items-center justify-center no-print" onClick={() => setQuickCobrarOpen(false)}>
                                    <div className="bg-white rounded-t-[2rem] sm:rounded-[2rem] w-full max-w-md p-6 max-h-[82vh] flex flex-col sheet-in shadow-2xl" onClick={e => e.stopPropagation()}>
                                        <div className="flex justify-between items-center mb-4">
                                            <h3 className="heading-font text-lg font-black text-slate-800">Cobrar a...</h3>
                                            <button onClick={() => setQuickCobrarOpen(false)} className="p-2 text-slate-400 bg-slate-100 rounded-xl"><Icon name="x" size={16}/></button>
                                        </div>
                                        <div className="relative mb-4">
                                            <Icon name="search" className="absolute left-4 top-3.5 text-slate-300" size={18} />
                                            <input type="text" placeholder="Buscar cliente..." className="w-full pl-12 p-3.5 bg-slate-50 border border-slate-100 rounded-2xl font-bold text-sm outline-none focus:border-emerald-500" value={quickCobrarSearch} onChange={e => setQuickCobrarSearch(e.target.value)} autoFocus />
                                        </div>
                                        <div className="overflow-y-auto space-y-2 -mx-1 px-1 pb-2">
                                            {quickCobrarClients.map(c => (
                                                <button key={c.id} onClick={() => { setSelectedClientId(c.id); setTransactionType('Interés'); setQuickCobrarOpen(false); setIsTransacting(true); }} className="w-full p-3 bg-slate-50 border border-slate-100 rounded-2xl flex items-center gap-3 active:scale-[0.98] text-left">
                                                    {c.idImageFront ? (
                                                        <img src={c.idImageFront} alt={c.name} className="w-10 h-10 rounded-xl object-cover border border-slate-200 flex-shrink-0" />
                                                    ) : (
                                                        <div className="w-10 h-10 rounded-xl bg-indigo-50 text-indigo-600 border border-indigo-100 flex items-center justify-center font-black flex-shrink-0">{c.name[0]}</div>
                                                    )}
                                                    <div className="min-w-0 flex-1">
                                                        <p className="font-black text-slate-800 text-sm truncate">{c.name}</p>
                                                        <p className="text-[10px] text-slate-400 font-bold">Cuota: {currency}{Math.round((c.loan.installmentAmount || 0) - (c.loan.partialCredit || 0)).toLocaleString()}</p>
                                                    </div>
                                                    <span className="text-[10px] font-black uppercase tracking-widest text-emerald-600 bg-emerald-50 border border-emerald-100 px-2.5 py-1.5 rounded-xl flex-shrink-0">Cobrar</span>
                                                </button>
                                            ))}
                                            {quickCobrarClients.length === 0 && (
                                                <p className="text-center text-[11px] font-black uppercase text-slate-400 py-8 tracking-widest">Sin resultados</p>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            )}
                            {/* Panel de notificaciones */}
                            {notifOpen && (
                                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[300] no-print animate-in" onClick={() => setNotifOpen(false)}>
                                    <div className="absolute bottom-0 left-0 right-0 max-w-md mx-auto sheet-in" onClick={e => e.stopPropagation()}>
                                        <div className="bg-white rounded-t-[2.5rem] shadow-2xl max-h-[82vh] flex flex-col overflow-hidden">
                                            <div className="pt-3 px-6 flex-shrink-0">
                                                <div className="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-4"></div>
                                                <div className="flex justify-between items-center mb-4">
                                                    <h3 className="heading-font text-lg font-black text-slate-800">Notificaciones</h3>
                                                    <button onClick={() => setNotifOpen(false)} className="p-2 text-slate-400 bg-slate-100 rounded-xl"><Icon name="x" size={16}/></button>
                                                </div>
                                            </div>
                                            <div className="overflow-y-auto px-6 pb-6">
                                                <div className="space-y-2">
                                            {pendingApprovalsCount > 0 && (
                                                <button onClick={() => { setNotifOpen(false); setPortfolioFilter('approvals'); setView('portfolio'); }} className="w-full p-4 bg-amber-50 border border-amber-200 rounded-2xl flex items-center gap-3 active:scale-[0.98] text-left">
                                                    <span className="w-10 h-10 bg-amber-200 text-amber-700 rounded-xl flex items-center justify-center flex-shrink-0"><Icon name="user-plus" size={18}/></span>
                                                    <span className="flex-1 min-w-0">
                                                        <span className="block font-black text-amber-800 text-sm">Aprobaciones pendientes</span>
                                                        <span className="block text-[11px] text-amber-600 font-bold">{pendingApprovalsCount} solicitud(es) por revisar</span>
                                                    </span>
                                                    <Icon name="arrow-left" size={16} className="text-amber-400 rotate-180 flex-shrink-0"/>
                                                </button>
                                            )}
                                            {overdueClients.length > 0 && (
                                                <button onClick={() => { setNotifOpen(false); setView('dashboard'); setAgendaTab('vencidos'); }} className="w-full p-4 bg-red-50 border border-red-200 rounded-2xl flex items-center gap-3 active:scale-[0.98] text-left">
                                                    <span className="w-10 h-10 bg-red-200 text-red-600 rounded-xl flex items-center justify-center flex-shrink-0"><Icon name="alert-triangle" size={18}/></span>
                                                    <span className="flex-1 min-w-0">
                                                        <span className="block font-black text-red-700 text-sm">Cuotas vencidas</span>
                                                        <span className="block text-[11px] text-red-500 font-bold">{overdueClients.length} cliente(s) en mora</span>
                                                    </span>
                                                    <Icon name="arrow-left" size={16} className="text-red-400 rotate-180 flex-shrink-0"/>
                                                </button>
                                            )}
                                            {expiredGuaranteesCount > 0 && (
                                                <button onClick={() => { setNotifOpen(false); setGuaranteeTab('active'); setGuaranteeSearch(''); setView('guarantees'); }} className="w-full p-4 bg-red-50 border border-red-200 rounded-2xl flex items-center gap-3 active:scale-[0.98] text-left">
                                                    <span className="w-10 h-10 bg-red-200 text-red-600 rounded-xl flex items-center justify-center flex-shrink-0"><Icon name="shield" size={18}/></span>
                                                    <span className="flex-1 min-w-0">
                                                        <span className="block font-black text-red-700 text-sm">Garantías vencidas</span>
                                                        <span className="block text-[11px] text-red-500 font-bold">{expiredGuaranteesCount} lista(s) para marcar como perdida</span>
                                                    </span>
                                                    <Icon name="arrow-left" size={16} className="text-red-400 rotate-180 flex-shrink-0"/>
                                                </button>
                                            )}
                                            {expiringSoonGuaranteesCount > 0 && (
                                                <button onClick={() => { setNotifOpen(false); setGuaranteeTab('active'); setGuaranteeSearch(''); setView('guarantees'); }} className="w-full p-4 bg-amber-50 border border-amber-200 rounded-2xl flex items-center gap-3 active:scale-[0.98] text-left">
                                                    <span className="w-10 h-10 bg-amber-200 text-amber-700 rounded-xl flex items-center justify-center flex-shrink-0"><Icon name="bell" size={18}/></span>
                                                    <span className="flex-1 min-w-0">
                                                        <span className="block font-black text-amber-800 text-sm">Garantías por vencer</span>
                                                        <span className="block text-[11px] text-amber-600 font-bold">{expiringSoonGuaranteesCount} vencen en 7 días o menos</span>
                                                    </span>
                                                    <Icon name="arrow-left" size={16} className="text-amber-400 rotate-180 flex-shrink-0"/>
                                                </button>
                                            )}
                                            {alertsCount === 0 && (
                                                <div className="text-center py-8">
                                                    <div className="w-14 h-14 bg-emerald-50 text-emerald-500 rounded-full flex items-center justify-center mx-auto mb-3"><Icon name="check-circle-2" size={24}/></div>
                                                    <p className="text-[11px] font-black uppercase tracking-widest text-slate-400">Todo al día</p>
                                                </div>
                                            )}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}
            </>);
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <script>
        // PWA: registra el Service Worker real
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW:', err));
            });
        }
    </script>
</body>
</html>
